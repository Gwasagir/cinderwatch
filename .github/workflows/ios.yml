name: iOS

on:
  push:
    paths: ['index.html', 'ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['index.html', 'ios/**', '.github/workflows/ios.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      simulator:
        description: Also build the app for the iOS Simulator
        type: boolean
        default: false

permissions:
  contents: write

# A newer push to the same branch cancels a build still running for an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The device build below already checks that the app compiles; the simulator build is only for
      # running it in the Simulator, so it is opt-in to keep macOS minutes down.
      - name: Build for the simulator
        if: inputs.simulator
        run: >
          xcodebuild -project ios/Cinderwatch.xcodeproj -scheme Cinderwatch -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim
          CODE_SIGNING_ALLOWED=NO build

      - name: Build for devices, unsigned
        run: >
          xcodebuild -project ios/Cinderwatch.xcodeproj -scheme Cinderwatch -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package
        run: |
          mkdir -p out/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Cinderwatch.app out/Payload/
          (cd out && zip -qr cinderwatch-unsigned.ipa Payload)
          if [ -d build/sim ]; then (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/out/cinderwatch-simulator.zip" Cinderwatch.app); fi

      - uses: actions/upload-artifact@v4
        with:
          name: cinderwatch-ios
          path: |
            out/cinderwatch-unsigned.ipa
            out/cinderwatch-simulator.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/cinderwatch-unsigned.ipa --clobber
